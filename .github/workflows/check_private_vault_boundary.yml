name: Vérifier la frontière public-privé sans jeton

on:
  workflow_dispatch:

# Aucun accès GitHub accordé au workflow et aucun secret consulté.
permissions: {}

jobs:
  verify_private_boundary:
    name: Test API GitHub sans authentification (aucun CV)
    if: github.repository == 'Jerempoli/job-agent-vault-runner' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier que le dépôt public répond et que le coffre reste privé
        shell: bash
        run: |
          node <<'NODE'
          const https = require('node:https');
          const PUBLIC_URL = 'https://api.github.com/repos/Jerempoli/job-agent-vault-runner';
          const PRIVATE_URL = 'https://api.github.com/repos/Jerempoli/job-agent-private-vault';
          function statusOnly(url) {
            return new Promise((resolve, reject) => {
              const request = https.get(url, {
                headers: {
                  'User-Agent': 'JobAgentIsolatedPublicRunnerBoundaryCheck/1',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'
                },
                timeout: 12000
              }, response => {
                const status = response.statusCode;
                response.resume();
                response.on('end', () => resolve(status));
              });
              request.on('timeout', () => request.destroy(new Error('Request timeout')));
              request.on('error', reject);
            });
          }
          (async () => {
            const publicStatus = await statusOnly(PUBLIC_URL);
            const privateStatus = await statusOnly(PRIVATE_URL);
            if (publicStatus !== 200 || privateStatus !== 404) {
              throw new Error('Frontière non validée ; vérifier la visibilité et les réponses GitHub.');
            }
            console.log('SUCCES : dépôt public joignable (200) ; coffre privé masqué sans authentification (404).');
            console.log('Aucune requête authentifiée, aucun jeton, aucune donnée de CV, aucune écriture.');
          })().catch(() => {
            console.error('ECHEC : impossible de confirmer la séparation public-privé.');
            process.exitCode = 1;
          });
          NODE
